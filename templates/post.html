<!DOCTYPE html>
<html lang="vi" data-theme="uu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="color-scheme" content="dark">
  <title>{{TITLE_TAG}}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="canonical" href="{{PAGE_URL}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="ÚÙ Creative Studio">
  <meta property="og:title" content="{{TITLE_TAG}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{PAGE_URL}}">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">{{JSONLD}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/uu-tokens.css">
  <link rel="stylesheet" href="css/uu-components.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <header class="site-header">
    <a class="site-header__logo" href="index.html" aria-label="ÚÙ Creative Studio - Trang chủ">
      <img src="assets/logo.png" alt="ÚÙ Creative Studio">
    </a>
    <nav class="site-header__nav" aria-label="Chính">
      <a class="uu-btn uu-btn--base uu-interactive tb-neutral-ghost-inv u-upper" href="index.html">Home</a>
      <a class="uu-btn uu-btn--base uu-interactive tb-neutral-ghost-inv u-upper" href="blog.html">Blog</a>
      <a class="uu-btn uu-btn--base uu-interactive tb-neutral-ghost-inv u-upper" href="design-system/">Design system</a>
      <a class="uu-btn uu-btn--base uu-interactive tb-neutral-ghost-inv u-upper" href="https://www.instagram.com/uucreative" target="_blank" rel="noopener">Shop</a>
    </nav>
    <a class="uu-btn uu-btn--base uu-interactive tb-accent-solid u-upper site-header__contact" href="mailto:tu@uucreative.co">Contact us</a>
    <button class="uu-btn uu-iconbtn uu-iconbtn--base uu-interactive tb-neutral-ghost-inv site-header__menu" aria-label="Mở menu" aria-expanded="false" aria-controls="menuSheet" data-menu-open>
      <svg class="uu-icon" aria-hidden="true"><use href="assets/icons.svg#menu-bars"/></svg>
    </button>
  </header>

  <main class="page-body">

    <div class="article-title">
      <p class="series text-heading-sm u-upper">{{SERIES}}</p>
      <h1 class="text-display-base u-upper">{{TITLE}}</h1>
      <p class="text-heading-sm u-upper">{{EPISODE}}</p>
    </div>

    <article class="article-content text-body">
{{CONTENT}}
    </article>

    <section class="related">
      <h2 class="text-display-base u-upper">Related article</h2>
      <div class="blog-grid">
{{RELATED}}
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p class="text-caption">© 2024 ÚÙ CREATIVE LTD. A private limited company incorporated in Viet Nam under enterprise code 0318657950.</p>
  </footer>

  <div class="uu-scrim uu-scrim--sheet" id="menuSheet" hidden>
    <div class="uu-panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="uu-panel__header">
        <h2 class="uu-panel__title text-heading-base" id="menuTitle">Menu</h2>
        <button class="uu-btn uu-iconbtn uu-iconbtn--sm uu-interactive tb-neutral-outline" aria-label="Đóng menu" data-menu-close>
          <svg class="uu-icon" aria-hidden="true"><use href="assets/icons.svg#xmark"/></svg>
        </button>
      </div>
      <div class="uu-panel__body">
        <nav class="uu-menu uu-menu--flat" aria-label="Menu">
          <a class="uu-menuitem uu-interactive" href="index.html"><svg class="uu-icon" aria-hidden="true"><use href="assets/icons.svg#house"/></svg>Home</a>
          <a class="uu-menuitem uu-interactive" href="blog.html" aria-current="page"><svg class="uu-icon" aria-hidden="true"><use href="assets/icons.svg#file-fill"/></svg>Blog<svg class="uu-icon uu-icon--16 uu-menuitem__check" aria-hidden="true"><use href="assets/icons.svg#check-fill"/></svg></a>
          <a class="uu-menuitem uu-interactive" href="design-system/"><svg class="uu-icon" aria-hidden="true"><use href="assets/icons.svg#layers-2"/></svg>Design system</a>
          <a class="uu-menuitem uu-interactive" href="https://www.instagram.com/uucreative" target="_blank" rel="noopener"><svg class="uu-icon" aria-hidden="true"><use href="assets/icons.svg#bag-shopping"/></svg>Shop</a>
        </nav>
        <div class="uu-btngroup">
          <a class="uu-btn uu-btn--lg uu-interactive tb-accent-solid" href="mailto:tu@uucreative.co"><svg class="uu-icon" aria-hidden="true"><use href="assets/icons.svg#envelope"/></svg>Contact us</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
