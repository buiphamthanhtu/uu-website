<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="color-scheme" content="dark">
  <title>{{TITLE_TAG}}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="canonical" href="{{PAGE_URL}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="ÚÙ Creative Studio">
  <meta property="og:title" content="{{TITLE_TAG}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{PAGE_URL}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="site-header__logo" href="index.html" aria-label="ÚÙ Creative Studio - Home">
      <img src="assets/logo.png" alt="ÚÙ Creative Studio">
    </a>
    <nav class="site-header__nav" aria-label="Main">
      <a class="btn btn--neutral" href="index.html">Home</a>
      <a class="btn btn--neutral" href="blog.html">blog</a>
      <a class="btn btn--neutral" href="https://www.instagram.com/uucreative" target="_blank" rel="noopener">Shop</a>
    </nav>
    <a class="btn btn--brand desktop-contact" href="mailto:tu@uucreative.co">contact us</a>
    <button class="btn btn--brand menu-toggle" aria-label="Open menu" aria-expanded="false" data-menu-open>☰</button>
  </header>

  <div class="menu-overlay" id="menu" role="dialog" aria-modal="true" aria-label="Menu">
    <button class="btn btn--brand menu-overlay__close" aria-label="Close menu" data-menu-close>✕</button>
    <a class="btn btn--neutral" href="index.html">Home</a>
    <a class="btn btn--neutral" href="blog.html">blog</a>
    <a class="btn btn--neutral" href="https://www.instagram.com/uucreative" target="_blank" rel="noopener">Shop</a>
    <a class="btn btn--brand" href="mailto:tu@uucreative.co">contact us</a>
  </div>

  <main class="page-body">

    <div class="article-title">
      <p class="eyebrow-line">{{SERIES}}</p>
      <h1>{{TITLE}}</h1>
      <p class="eyebrow-line">{{EPISODE}}</p>
    </div>

    <article class="article-content">
{{CONTENT}}
    </article>

    <section class="related">
      <h2>Related article</h2>
      <div class="blog-grid">
{{RELATED}}
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© 2024 ÚÙ CREATIVE LTD. A private limited company incorporated in Viet Nam under enterprise code 0318657950.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
